[project]
name = "celery-uptime"
version = "0.1.0"
description = "Embedded HTTP uptime checks for Celery worker and beat processes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "celery>=5.3",
    "fastapi>=0.100",
    "redis>=5",
    "uvicorn>=0.22",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
