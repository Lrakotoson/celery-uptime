[project]
name = "celery-uptime"
version = "0.1.0"
description = "Embedded HTTP uptime checks for Celery worker and beat processes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "celery>=5.3",
    "fastapi>=0.100",
    "uvicorn>=0.22",
]

[project.optional-dependencies]
redis = [
    "redis>=4.5.2",
]
sqs = [
    "boto3>=1.26.143",
    "kombu[sqs]>=5.5.0",
]
kafka = [
    "kombu[confluentkafka]>=5.5.0",
]
sqlalchemy = [
    "sqlalchemy>=1.4.48,<2.1",
]
django = [
    "Django>=2.2.28",
]
mongodb = [
    "pymongo>=4",
]
elasticsearch = [
    "elasticsearch>=8,<10",
]
cassandra = [
    "cassandra-driver>=3.25,<4",
]
memcache = [
    "python-memcached>=1.61",
]
all = [
    "redis>=4.5.2",
    "boto3>=1.26.143",
    "kombu[sqs,confluentkafka]>=5.5.0",
    "sqlalchemy>=1.4.48,<2.1",
    "Django>=2.2.28",
    "pymongo>=4",
    "elasticsearch>=8,<10",
    "cassandra-driver>=3.25,<4",
    "python-memcached>=1.61",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
