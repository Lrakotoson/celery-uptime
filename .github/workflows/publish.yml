name: Publish package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9][A-Za-z0-9._!+-]*$'; then
            echo "::error::Release tag must start with v and contain the pyproject version, for example v0.2.0."
            exit 1
          fi

          TAG_VERSION="${RELEASE_TAG#v}"
          PYPROJECT_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match pyproject version $PYPROJECT_VERSION."
            exit 1
          fi

          git fetch origin main
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Release tag $RELEASE_TAG is not based on the main branch."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest

      - name: Run Ruff
        run: uv run ruff check .

      - name: Compile package modules
        run: python3 -m py_compile src/celery_uptime/*.py

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uv run twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
