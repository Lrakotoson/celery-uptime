name: Bump version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "PEP 440 version without leading v, for example 0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump package version
    runs-on: ubuntu-latest

    steps:
      - name: Ensure workflow runs from main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from the main branch."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bump release metadata
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/bump_version.py "$VERSION" --repo-root .

      - name: Validate generated changes
        run: |
          git diff --check
          git diff -- pyproject.toml CHANGELOG.md

      - name: Commit and tag release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml CHANGELOG.md
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:main
          git push origin "v${VERSION}"
